<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LasMascotas - autoryzacja OLX</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         max-width: 640px; margin: 60px auto; padding: 0 20px;
         background: #fafafa; color: #1a1a1a; line-height: 1.6; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; font-size: 14px; }
  #box { background: #fff; border: 1px solid #ddd; border-radius: 8px;
         padding: 20px; margin-top: 24px; }
  #code { font-family: ui-monospace, Consolas, monospace; font-size: 15px;
          word-break: break-all; background: #f4f4f4; padding: 12px;
          border-radius: 6px; display: block; }
  button { margin-top: 14px; padding: 10px 18px; font-size: 14px;
           border: 0; border-radius: 6px; background: #1a1a1a; color: #fff;
           cursor: pointer; }
  button:hover { background: #333; }
  .err { color: #b00020; }
  .ok { color: #0a7d3f; font-size: 14px; margin-top: 10px; min-height: 20px; }
</style>
</head>
<body>
<h1>Autoryzacja OLX</h1>
<p class="sub">LasMascotas - wewnetrzne narzedzie zarzadzania ogloszeniami</p>

<div id="box">
  <div id="content">Oczekiwanie na kod autoryzacyjny...</div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var code = params.get("code");
  var error = params.get("error");
  var box = document.getElementById("content");

  if (error) {
    box.innerHTML = '<p class="err"><strong>Blad autoryzacji:</strong> ' +
      error + '<br>' + (params.get("error_description") || "") + '</p>';
  } else if (code) {
    box.innerHTML =
      '<p><strong>Kod autoryzacyjny</strong> - skopiuj i wklej do skryptu:</p>' +
      '<code id="code"></code>' +
      '<button id="copy">Kopiuj do schowka</button>' +
      '<div class="ok" id="msg"></div>';
    document.getElementById("code").textContent = code;
    document.getElementById("copy").onclick = function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById("msg").textContent = "Skopiowano.";
      });
    };
  } else {
    box.innerHTML = '<p>Brak parametru <code>code</code> w adresie. ' +
      'Ta strona odbiera przekierowanie po zalogowaniu w OLX.</p>';
  }
</script>
</body>
</html>
